<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CERN Careers • Machine Learning Engineer Intern Application</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; padding: 40px; margin: 0; }
    .container { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; color: #1e293b; margin-top: 0; }
    h2 { font-size: 14px; color: #2563eb; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="tel"], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; box-sizing: border-box;
    }
    input[type="file"] { padding: 8px 0; font-size: 12px; }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #334155; margin-top: 12px; }
    button.submit-btn {
      width: 100%; margin-top: 24px; padding: 12px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer;
    }
    button.submit-btn:hover { background: #1d4ed8; }
    .success-banner { display: none; background: #dcfce7; color: #166534; padding: 16px; border-radius: 8px; margin-top: 20px; font-weight: 600; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Postuler chez CERN</h1>
    <h2>Machine Learning Engineer Intern (Stage PFE - 6 mois) • Genève, Suisse</h2>

    <form id="apply-form" onsubmit="event.preventDefault(); document.getElementById('apply-form').style.display='none'; document.getElementById('confirmation').style.display='block';">
      <div class="row">
        <div class="form-group">
          <label>Prénom *</label>
          <input type="text" name="first_name" id="first_name" placeholder="Votre prénom" required>
        </div>
        <div class="form-group">
          <label>Nom de famille *</label>
          <input type="text" name="last_name" id="last_name" placeholder="Votre nom" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" id="email" placeholder="nom@exemple.com" required>
      </div>

      <div class="form-group">
        <label>Téléphone *</label>
        <input type="tel" name="phone" id="phone" placeholder="+33 6 00 00 00 00">
      </div>

      <div class="form-group">
        <label>CV (Format PDF) *</label>
        <input type="file" name="resume" id="resume" accept=".pdf,.doc,.docx" required>
      </div>

      <div class="form-group">
        <label>Profil LinkedIn</label>
        <input type="text" name="linkedin" id="linkedin" placeholder="https://linkedin.com/in/...">
      </div>

      <div class="form-group">
        <label>GitHub ou Portfolio</label>
        <input type="text" name="github" id="github" placeholder="https://github.com/...">
      </div>

      <div class="form-group">
        <label>Lettre de motivation</label>
        <textarea name="cover_letter" id="cover_letter" rows="4" placeholder="Expliquez en quelques mots votre intérêt pour le poste..."></textarea>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" name="authorized" id="authorized" value="yes">
        <label for="authorized" style="margin:0; font-weight:normal;">Êtes-vous légalement autorisé(e) à travailler en Suisse / UE pour ce stage ?</label>
      </div>

      <button type="submit" class="submit-btn">Envoyer la candidature</button>
    </form>

    <div id="confirmation" class="success-banner">
      🎉 Félicitations ! Votre candidature pour Machine Learning Engineer Intern a bien été transmise à CERN.
    </div>
  </div>
</body>
</html>
